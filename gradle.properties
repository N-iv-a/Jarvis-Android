# Properties globali di Gradle.

# --- Performance ---
# JVM con 2GB di heap — abbastanza per builds Android mediamente complesse.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Build parallela tra moduli (oggi ne abbiamo uno solo, ma non costa nulla).
org.gradle.parallel=true
# Caching: riusa output di task che non sono cambiati.
org.gradle.caching=true
# Configurazione on-demand: configura solo i moduli richiesti.
org.gradle.configureondemand=true

# --- AndroidX ---
# Obbligatorio dal 2020 — usiamo le librerie moderne, non le vecchie support.
android.useAndroidX=true
# Non ci servono conversioni automatiche da vecchie dipendenze.
android.nonTransitiveRClass=true

# --- Kotlin ---
# Compilazione incrementale: più veloce dopo la prima build.
kotlin.incremental=true
kotlin.code.style=official
